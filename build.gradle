plugins {
    id 'java'
}

version = '1.3.16'
group = 'com.alber.xnetocbridge'

base {
    archivesName = 'xnet-oc-bridge'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

compileJava {
    options.encoding = 'UTF-8'
}

def extraCompileJars = providers.gradleProperty('extraCompileJars')
        .map { value -> value.split(';').findAll { it.trim() }.collect { file(it) } }
        .getOrElse([])

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    compileOnly files(extraCompileJars)
}
